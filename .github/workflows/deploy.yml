name: Deploy PLAYFINDER
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Fetch official Roblox game icons
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.parse, urllib.request
          html = open("index.html", encoding="utf-8").read()
          place_ids = {int(value) for value in re.findall(r"placeId:(\d+)", html)}
          extra = json.load(open("games-extra.json", encoding="utf-8"))
          place_ids.update(int(row[8]) for row in extra)
          ids = sorted(place_ids)
          print(f"Looking up Roblox artwork for {len(ids)} games")
          result = {}
          for start in range(0, len(ids), 50):
              batch = ids[start:start + 50]
              query = urllib.parse.urlencode({
                  "placeIds": ",".join(str(value) for value in batch),
                  "returnPolicy": "AutoGenerated",
                  "size": "512x512",
                  "format": "Png",
                  "isCircular": "false",
              })
              url = "https://proxy.cors.dev/https://thumbnails.roblox.com/v1/places/gameicons?" + query
              for attempt in range(3):
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 PLAYFINDER/1.0",
                      "Accept": "application/json",
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=35) as response:
                          payload = json.load(response)
                      for item in payload.get("data", []):
                          image_url = item.get("imageUrl")
                          if item.get("state") == "Completed" and image_url and image_url.startswith("https://"):
                              result[str(item.get("targetId"))] = image_url
                      break
                  except Exception as error:
                      print(f"Roblox thumbnail batch attempt {attempt + 1} failed: {error}")
                      if attempt == 2:
                          raise
                      time.sleep(2)
          with open("game-images.json", "w", encoding="utf-8") as file:
              json.dump(result, file, separators=(",", ":"))
          print(f"Roblox returned artwork for {len(result)} of {len(ids)} games")
          if not result:
              raise SystemExit("Roblox did not return any game icons; refusing to deploy blank covers")
          PY
      - name: Validate app JavaScript and catalog
        run: |
          python3 - <<'PY'
          import re, json
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No app script found"
          open("/tmp/playfinder.js", "w", encoding="utf-8").write("\n".join(scripts))
          catalog = json.load(open("games-extra.json", encoding="utf-8"))
          images = json.load(open("game-images.json", encoding="utf-8"))
          assert len(catalog) == 58, f"Expected 58 extra games, got {len(catalog)}"
          assert len(images) > 0, "No Roblox game artwork was returned"
          assert 'fetch("./game-images.json"' in html, "App does not load the image map"
          assert 'id="zip"' not in html and 'id="install"' not in html, "Download/install controls remain"
          PY
          node --check /tmp/playfinder.js
      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp index.html games-extra.json game-images.json icon.svg README.md sw.js .nojekyll site/
          test -s site/index.html
          test -s site/game-images.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
