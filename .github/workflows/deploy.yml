name: Deploy PLAYFINDER
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build downloadable source ZIP
        run: |
          zip -q PLAYFINDER-app.zip index.html manifest.webmanifest sw.js icon.svg README.md
      - name: Prepare app site
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest sw.js icon.svg README.md PLAYFINDER-app.zip site/
          test -s site/index.html
          unzip -tq site/PLAYFINDER-app.zip
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
