name: Deploy PLAYFINDER
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate app JavaScript and manifest
        run: |
          python3 - <<'PY'
          import re, json
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No app script found"
          open("/tmp/playfinder.js", "w", encoding="utf-8").write("\n".join(scripts))
          json.load(open("manifest.webmanifest", encoding="utf-8"))
          PY
          node --check /tmp/playfinder.js
      - name: Build downloadable source ZIP
        run: |
          zip -q PLAYFINDER-app.zip index.html games-extra.json manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png README.md
      - name: Prepare app site
        run: |
          mkdir -p site
          cp index.html games-extra.json manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png README.md PLAYFINDER-app.zip site/
          test -s site/index.html
          unzip -tq site/PLAYFINDER-app.zip
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
