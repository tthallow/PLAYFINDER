name: Deploy PLAYFINDER
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate app JavaScript and catalog
        run: |
          python3 - <<'PY'
          import re, json
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No app script found"
          open("/tmp/playfinder.js", "w", encoding="utf-8").write("\n".join(scripts))
          catalog = json.load(open("games-extra.json", encoding="utf-8"))
          assert len(catalog) == 58, f"Expected 58 extra games, got {len(catalog)}"
          assert "proxy.cors.dev/" in html, "App does not request Roblox thumbnails through the browser proxy"
          assert 'id="zip"' not in html and 'id="install"' not in html, "Download/install controls remain"
          PY
          node --check /tmp/playfinder.js
      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp index.html games-extra.json icon.svg README.md sw.js .nojekyll site/
          test -s site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
